server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  # Cache only the browser assets this static app intentionally exposes.
  location = /styles.css {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files /styles.css =404;
  }

  location = /script.js {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files /script.js =404;
  }

  location /js/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location ~ /\.(?!well-known/) {
    return 404;
  }

  location / {
    return 404;
  }
}
