<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaTeX Improver</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="toolbar">
        <div class="toolbar-title">LaTeX Improver</div>
        <div class="toolbar-controls">
          <select id="operationSelect" aria-label="Operation">
            <option value="labeling">Labeling</option>
            <option value="equation-content-mark">Equation Content Mark (%)</option>
            <option value="math-formatting">Math Formatting (Not Implemented)</option>
          </select>
          <input id="fileInput" type="file" accept=".tex,.txt,.latex" hidden />
          <button id="uploadButton" type="button">Upload</button>
          <button id="formatButton" type="button">Apply</button>
          <button id="copyButton" type="button">Copy</button>
          <button id="downloadButton" type="button">Download</button>
        </div>
      </div>
      <p id="statusMessage" class="status" aria-live="polite"></p>
      <textarea id="latexInput" class="editor" spellcheck="false" placeholder="\begin{equation}&#10;E = mc^2&#10;\end{equation}"></textarea>
    </main>
    <footer class="app-footer">
      <small id="versionLabel">Version</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
