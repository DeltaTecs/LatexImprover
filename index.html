<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaTeX Improver</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="formatCompleteIndicator" class="format-complete-indicator" aria-hidden="true"></div>
    <main class="app-shell">
      <div class="toolbar">
        <div class="toolbar-title">LaTeX Improver</div>
        <div class="toolbar-controls">
          <select id="operationSelect" aria-label="Operation">
            <option value="labeling">Labeling</option>
            <option value="equation-content-mark">Equation Content Mark (%)</option>
            <option value="explicit-spacing">Explicit Spacing (\ )</option>
            <option value="en-dash-names">En-Dash Names</option>
          </select>
          <input id="fileInput" type="file" accept=".tex,.txt,.latex" hidden />
          <button id="uploadButton" type="button">Upload</button>
          <button id="formatButton" type="button">Apply</button>
          <button id="copyButton" type="button">Copy</button>
          <button id="downloadButton" type="button">Download</button>
        </div>
      </div>
      <p id="statusMessage" class="status" aria-live="polite"></p>
      <div id="latexEditor" class="editor"></div>
    </main>
    <footer class="app-footer">
      <small id="versionLabel">Version</small>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
